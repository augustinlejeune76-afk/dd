
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande servo et moteur micro:bit</title>

<style>
body {
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}
main {
    max-width: 450px;
    margin: 30px auto;
    background: #1e293b;
    padding: 25px;
    border-radius: 18px;
}
button {
    padding: 16px;
    margin: 7px;
    border: 0;
    border-radius: 10px;
    color: white;
    font-size: 17px;
    background: #2563eb;
}
button:disabled { opacity: 0.4; }
#status { color: #fbbf24; }
.value {
    font-size: 38px;
    margin: 12px;
}
.panel {
    background: #263449;
    padding: 15px;
    border-radius: 12px;
    margin: 15px 0;
}
#messages {
    background: #0f172a;
    padding: 12px;
    border-radius: 10px;
    min-height: 100px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>
<main>
    <h1>Commande micro:bit</h1>

    <p id="status">Non connecté</p>

    <button id="connect">Connecter la micro:bit</button>
    <button id="disconnect" disabled>Déconnecter</button>

    <hr>

    <div class="panel">
        <h2>Servomoteur P0</h2>
        <p>Joystick gauche horizontal</p>
        <div class="value" id="angle">90°</div>
        <p>45° ← Centre → 135°</p>
        <p>Crans de 5°</p>
    </div>

    <div class="panel">
        <h2>Moteur M1</h2>
        <p>RT : marche avant</p>
        <p>LT : marche arrière</p>
        <div class="value" id="speed">0</div>
        <p id="direction">Moteur arrêté</p>
    </div>

    <p id="gamepadStatus">Manette non détectée</p>

    <h3>Messages reçus</h3>
    <div id="messages">En attente...</div>
</main>

<script>
const SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const TX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let rxCharacteristic = null;
let txCharacteristic = null;
let buffer = "";
let sending = Promise.resolve();

let lastAngle = null;
let lastSpeed = null;
let lastSendTime = 0;

const status = document.getElementById("status");
const messages = document.getElementById("messages");
const angleDisplay = document.getElementById("angle");
const speedDisplay = document.getElementById("speed");
const directionDisplay = document.getElementById("direction");
const gamepadStatus = document.getElementById("gamepadStatus");

const connectBtn = document.getElementById("connect");
const disconnectBtn = document.getElementById("disconnect");

function log(text) {
    messages.textContent += "\n" + text;
}

function setButtons(connected) {
    disconnectBtn.disabled = !connected;
    connectBtn.disabled = connected;
}

function receive(event) {
    buffer += new TextDecoder().decode(event.target.value);
    const lines = buffer.split("\n");
    buffer = lines.pop();

    for (const line of lines) {
        if (line.trim()) {
            log("Micro:bit → " + line.trim());
        }
    }
}

function send(command) {
    if (!rxCharacteristic) return;

    sending = sending.then(async () => {
        if (!rxCharacteristic) return;

        const data = new TextEncoder().encode(command + "\n");

        if (rxCharacteristic.properties.writeWithoutResponse) {
            await rxCharacteristic.writeValueWithoutResponse(data);
        } else {
            await rxCharacteristic.writeValueWithResponse(data);
        }
    }).catch(error => {
        log("Erreur : " + error.message);
    });

    return sending;
}

async function connect() {
    try {
        messages.textContent = "";
        status.textContent = "Recherche de la micro:bit...";
        connectBtn.disabled = true;

        if (!navigator.bluetooth) {
            throw new Error("Bluetooth Web indisponible. Utilise Chrome et HTTPS.");
        }

        device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC micro:bit" }],
            optionalServices: [SERVICE]
        });

        device.addEventListener("gattserverdisconnected", disconnected);

        status.textContent = "Connexion en cours...";

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE);

        rxCharacteristic = await service.getCharacteristic(RX);
        txCharacteristic = await service.getCharacteristic(TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener(
            "characteristicvaluechanged",
            receive
        );

        status.textContent = "Connecté à " + device.name;
        setButtons(true);

        lastAngle = 90;
        lastSpeed = 0;

        await send("SERVO:90");
        await send("MOTEUR:0");

        log("Bluetooth prêt !");
    } catch (error) {
        status.textContent = "Connexion échouée";
        log("ERREUR : " + error.name + " - " + error.message);
        rxCharacteristic = null;
        txCharacteristic = null;
        setButtons(false);
    }
}

function disconnected() {
    rxCharacteristic = null;
    txCharacteristic = null;
    status.textContent = "Non connecté";
    setButtons(false);

    angleDisplay.textContent = "90°";
    speedDisplay.textContent = "0";
    directionDisplay.textContent = "Moteur arrêté";

    lastAngle = null;
    lastSpeed = null;

    log("Micro:bit déconnectée.");
}

function updateGamepad() {
    const pads = navigator.getGamepads();
    let pad = null;

    for (const p of pads) {
        if (p && p.connected) {
            pad = p;
            break;
        }
    }

    if (pad) {
        gamepadStatus.textContent = "Manette : " + pad.id;

        // JOYSTICK GAUCHE : SERVO P0
        let left = pad.axes[0] || 0;

        if (Math.abs(left) < 0.12) {
            left = 0;
        }

        let angle = Math.round((90 + left * 45) / 5) * 5;
        angle = Math.max(45, Math.min(135, angle));

        angleDisplay.textContent = angle + "°";

        // GACHETTES RT ET LT : MOTEUR M1
        let rt = pad.buttons[7] ? pad.buttons[7].value : 0;
        let lt = pad.buttons[6] ? pad.buttons[6].value : 0;

        let speed = Math.round((rt - lt) * 255);
        speed = Math.max(-255, Math.min(255, speed));

        speedDisplay.textContent = Math.abs(speed);

        if (speed > 0) {
            directionDisplay.textContent = "Marche avant (RT)";
        } else if (speed < 0) {
            directionDisplay.textContent = "Marche arrière (LT)";
        } else {
            directionDisplay.textContent = "Moteur arrêté";
        }

        // ENVOI BLUETOOTH
        const now = Date.now();

        if (rxCharacteristic && now - lastSendTime >= 40) {
            if (angle !== lastAngle) {
                lastAngle = angle;
                send("SERVO:" + angle);
            }

            if (speed !== lastSpeed) {
                lastSpeed = speed;
                send("MOTEUR:" + speed);
            }

            lastSendTime = now;
        }

    } else {
        gamepadStatus.textContent = "Manette non détectée";

        // Arrêt de sécurité si la manette disparaît
        if (rxCharacteristic) {
            if (lastAngle !== 90) send("SERVO:90");
            if (lastSpeed !== 0) send("MOTEUR:0");
        }

        lastAngle = 90;
        lastSpeed = 0;

        angleDisplay.textContent = "90°";
        speedDisplay.textContent = "0";
        directionDisplay.textContent = "Moteur arrêté";
    }

    requestAnimationFrame(updateGamepad);
}

window.addEventListener("gamepadconnected", event => {
    gamepadStatus.textContent = "Manette connectée : " + event.gamepad.id;
});

window.addEventListener("gamepaddisconnected", () => {
    gamepadStatus.textContent = "Manette déconnectée";
});

connectBtn.addEventListener("click", connect);

disconnectBtn.addEventListener("click", () => {
    if (device && device.gatt.connected) {
        device.gatt.disconnect();
    }
});

requestAnimationFrame(updateGamepad);
</script>
</body>
</html>
