
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande servo Xbox</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #202431;
    color: white;
    padding: 20px;
}
button {
    padding: 14px 20px;
    margin: 7px;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
}
.connect { background: #36a269; color: white; }
.action { background: #3478db; color: white; }
.status {
    background: #30394b;
    padding: 12px;
    border-radius: 10px;
    margin: 12px auto;
    max-width: 420px;
}
#angle {
    font-size: 38px;
    margin: 20px;
}
</style>
</head>

<body>

<h1>Commande du servomoteur</h1>

<div class="status" id="bluetoothStatus">
    Micro:bit non connectée
</div>

<div class="status" id="gamepadStatus">
    Manette Xbox non détectée
</div>

<button class="connect" onclick="connectMicrobit()">
    Connecter la micro:bit
</button>

<div id="angle">90°</div>

<button class="action" onclick="sendCommand('CENTRER')">
    Recentrer le servo
</button>

<p>
Joystick gauche horizontal :<br>
Gauche = 45°<br>
Centre = 90°<br>
Droite = 135°
</p>

<div class="status" id="message">En attente...</div>

<script>
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const RX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let txCharacteristic = null;
let rxCharacteristic = null;

let lastAngleSent = -1;
let lastSendTime = 0;

// CONNEXION BLUETOOTH
async function connectMicrobit() {
    try {
        device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }]
        });

        device.addEventListener("gattserverdisconnected", () => {
            document.getElementById("bluetoothStatus").textContent =
                "Micro:bit déconnectée";
            txCharacteristic = null;
            rxCharacteristic = null;
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(RX_UUID);
        txCharacteristic = await service.getCharacteristic(TX_UUID);

        await txCharacteristic.startNotifications();

        txCharacteristic.addEventListener(
            "characteristicvaluechanged",
            event => {
                const value = new TextDecoder().decode(event.target.value);
                document.getElementById("message").textContent =
                    "Micro:bit : " + value.trim();
            }
        );

        document.getElementById("bluetoothStatus").textContent =
            "Micro:bit connectée : " + device.name;

    } catch (error) {
        document.getElementById("message").textContent =
            "Erreur Bluetooth : " + error.message;
    }
}

// ENVOI DES COMMANDES
async function sendCommand(command) {
    if (!rxCharacteristic) {
        document.getElementById("message").textContent =
            "Connecte d'abord la micro:bit.";
        return;
    }

    try {
        const data = new TextEncoder().encode(command + "\n");

        if (rxCharacteristic.writeValueWithoutResponse) {
            await rxCharacteristic.writeValueWithoutResponse(data);
        } else {
            await rxCharacteristic.writeValueWithResponse(data);
        }

        document.getElementById("message").textContent =
            "Envoyé : " + command;

    } catch (error) {
        document.getElementById("message").textContent =
            "Erreur : " + error.message;
    }
}

// LECTURE DU JOYSTICK XBOX
function updateGamepad() {
    const gamepads = navigator.getGamepads();
    let pad = null;

    for (const gamepad of gamepads) {
        if (gamepad && gamepad.connected) {
            pad = gamepad;
            break;
        }
    }

    if (pad) {
        document.getElementById("gamepadStatus").textContent =
            "Manette détectée : " + pad.id;

        // Joystick gauche horizontal
        let stick = pad.axes[0] || 0;

        // Zone neutre au centre
        if (Math.abs(stick) < 0.12) {
            stick = 0;
        }

        // Conversion de -1 à +1 vers 45° à 135°
        let angle = Math.round(90 + stick * 45);

        // Sécurité : limite entre 45° et 135°
        angle = Math.max(45, Math.min(135, angle));

        document.getElementById("angle").textContent = angle + "°";

        const now = Date.now();

        if (
            rxCharacteristic &&
            Math.abs(angle - lastAngleSent) >= 1 &&
            now - lastSendTime >= 100
        ) {
            lastAngleSent = angle;
            lastSendTime = now;
            sendCommand("ANGLE:" + angle);
        }

    } else {
        document.getElementById("gamepadStatus").textContent =
            "Manette Xbox non détectée";
    }

    requestAnimationFrame(updateGamepad);
}

window.addEventListener("gamepadconnected", event => {
    document.getElementById("gamepadStatus").textContent =
        "Manette connectée : " + event.gamepad.id;
});

window.addEventListener("gamepaddisconnected", () => {
    document.getElementById("gamepadStatus").textContent =
        "Manette déconnectée";
});

requestAnimationFrame(updateGamepad);

</script>
</body>
</html>
