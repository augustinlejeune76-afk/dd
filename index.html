
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande servo</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #202431;
    color: white;
    padding: 20px;
}
button {
    padding: 14px 20px;
    margin: 7px;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
}
.connect { background: #36a269; color: white; }
.action { background: #3478db; color: white; }
.status {
    background: #30394b;
    padding: 12px;
    border-radius: 10px;
    margin: 12px auto;
    max-width: 420px;
}
#angle {
    font-size: 38px;
    margin: 20px;
}
</style>
</head>

<body>

<h1>Commande du servomoteur</h1>

<div class="status" id="bluetoothStatus">
    Micro:bit non connectée
</div>

<button class="connect" onclick="connectMicrobit()">
    Connecter la micro:bit
</button>

<div id="angle">90°</div>

<button class="action" onclick="sendCommand('OUVRIR')">
    Ouvrir (135°)
</button>

<button class="action" onclick="sendCommand('FERMER')">
    Fermer (45°)
</button>

<button class="action" onclick="sendCommand('CENTRER')">
    Recentrer (90°)
</button>

<button class="action" onclick="sendCommand('PLUS')">
    +5°
</button>

<button class="action" onclick="sendCommand('MOINS')">
    -5°
</button>

<div class="status" id="message">En attente...</div>

<script>
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const TX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const RX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let txCharacteristic = null;
let rxCharacteristic = null;

async function connectMicrobit() {
    try {
        device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }]
        });

        device.addEventListener("gattserverdisconnected", () => {
            document.getElementById("bluetoothStatus").textContent =
                "Micro:bit déconnectée";
            txCharacteristic = null;
            rxCharacteristic = null;
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(RX_UUID);
        txCharacteristic = await service.getCharacteristic(TX_UUID);

        await txCharacteristic.startNotifications();

        txCharacteristic.addEventListener(
            "characteristicvaluechanged",
            event => {
                const value = new TextDecoder().decode(event.target.value);
                document.getElementById("message").textContent =
                    "Micro:bit : " + value.trim();

                if (value.includes("OUVERT")) {
                    document.getElementById("angle").textContent = "135°";
                } else if (value.includes("FERME")) {
                    document.getElementById("angle").textContent = "45°";
                } else if (value.includes("CENTRE 90")) {
                    document.getElementById("angle").textContent = "90°";
                } else {
                    const match = value.match(/ANGLE\s*:\s*(\d+)/);
                    if (match) {
                        document.getElementById("angle").textContent =
                            match[1] + "°";
                    }
                }
            }
        );

        document.getElementById("bluetoothStatus").textContent =
            "Micro:bit connectée : " + device.name;

    } catch (error) {
        document.getElementById("message").textContent =
            "Erreur Bluetooth : " + error.message;
    }
}

async function sendCommand(command) {
    if (!rxCharacteristic) {
        document.getElementById("message").textContent =
            "Connecte d'abord la micro:bit.";
        return;
    }

    try {
        const data = new TextEncoder().encode(command + "\n");

        if (rxCharacteristic.writeValueWithoutResponse) {
            await rxCharacteristic.writeValueWithoutResponse(data);
        } else {
            await rxCharacteristic.writeValueWithResponse(data);
        }

        document.getElementById("message").textContent =
            "Envoyé : " + command;

    } catch (error) {
        document.getElementById("message").textContent =
            "Erreur : " + error.message;
    }
}
</script>

</body>
</html>
