<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande servomoteur micro:bit</title>
<style>
body {
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}
main {
    max-width: 450px;
    margin: 30px auto;
    background: #1e293b;
    padding: 25px;
    border-radius: 18px;
}
button {
    padding: 16px;
    margin: 7px;
    border: 0;
    border-radius: 10px;
    color: white;
    font-size: 17px;
    background: #2563eb;
}
button:disabled { opacity: 0.4; }
#status { color: #fbbf24; }
#messages {
    background: #0f172a;
    padding: 12px;
    border-radius: 10px;
    min-height: 100px;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.slider-container {
    margin: 30px 0;
}
input[type="range"] {
    width: 100%;
    height: 35px;
    cursor: pointer;
    touch-action: pan-y;
}
#angle {
    font-size: 35px;
    margin: 15px;
}
.instructions {
    color: #cbd5e1;
}
</style>
</head>
<body>
<main>
    <h1>Commande du servo</h1>
    <p id="status">Non connecté</p>

    <button id="connect">Connecter la micro:bit</button>
    <button id="disconnect" disabled>Déconnecter</button>

    <hr>
    <h2>Contrôle du servomoteur</h2>

    <div class="slider-container">
        <p class="instructions">Maintiens et déplace le curseur</p>
        <div id="angle">90°</div>

        <input
            type="range"
            id="servoSlider"
            min="45"
            max="135"
            value="90"
            step="1"
            disabled
        >

        <p>45° ← Gauche | Centre → 135°</p>
        <p class="instructions">Relâche pour revenir à 90°</p>
    </div>

    <h3>Messages reçus</h3>
    <div id="messages">En attente...</div>
</main>

<script>
const SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const TX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let rxCharacteristic = null;
let txCharacteristic = null;
let buffer = "";
let lastAngleSent = -1;
let lastSendTime = 0;
let sendTimer = null;

const status = document.getElementById("status");
const messages = document.getElementById("messages");
const slider = document.getElementById("servoSlider");
const angleDisplay = document.getElementById("angle");

const connectBtn = document.getElementById("connect");
const disconnectBtn = document.getElementById("disconnect");

function log(text) {
    messages.textContent += "\n" + text;
}

function setButtons(connected) {
    disconnectBtn.disabled = !connected;
    slider.disabled = !connected;
    connectBtn.disabled = connected;
}

function receive(event) {
    buffer += new TextDecoder().decode(event.target.value);
    const lines = buffer.split("\n");
    buffer = lines.pop();

    for (const line of lines) {
        if (line.trim()) log("Micro:bit → " + line.trim());
    }
}

async function send(command) {
    if (!rxCharacteristic) {
        return;
    }

    try {
        const data = new TextEncoder().encode(command + "\n");

        if (rxCharacteristic.properties.writeWithoutResponse) {
            await rxCharacteristic.writeValueWithoutResponse(data);
        } else if (rxCharacteristic.properties.write) {
            await rxCharacteristic.writeValueWithResponse(data);
        } else {
            throw new Error("Écriture Bluetooth indisponible");
        }

        log("Téléphone → " + command);
    } catch (error) {
        log("Erreur : " + error.message);
    }
}

async function connect() {
    try {
        messages.textContent = "";
        status.textContent = "Recherche de la micro:bit...";
        connectBtn.disabled = true;

        if (!navigator.bluetooth) {
            throw new Error("Bluetooth Web indisponible. Utilise Chrome et HTTPS.");
        }

        device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC micro:bit" }],
            optionalServices: [SERVICE]
        });

        log("Micro:bit choisie : " + device.name);
        device.addEventListener("gattserverdisconnected", disconnected);

        status.textContent = "Connexion en cours...";

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE);

        rxCharacteristic = await service.getCharacteristic(RX);
        txCharacteristic = await service.getCharacteristic(TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener(
            "characteristicvaluechanged",
            receive
        );

        status.textContent = "Connecté à " + device.name;
        setButtons(true);
        log("Bluetooth prêt !");
        slider.value = 90;
        angleDisplay.textContent = "90°";

    } catch (error) {
        status.textContent = "Connexion échouée";
        log("ERREUR : " + error.name + " - " + error.message);
        rxCharacteristic = null;
        txCharacteristic = null;
        setButtons(false);
    }
}

function disconnected() {
    rxCharacteristic = null;
    txCharacteristic = null;
    status.textContent = "Non connecté";
    setButtons(false);
    log("Micro:bit déconnectée.");
}

function sendSliderAngle(angle) {
    const now = Date.now();

    if (angle === lastAngleSent) return;

    if (now - lastSendTime >= 70) {
        lastAngleSent = angle;
        lastSendTime = now;
        send("ANGLE:" + angle);
    } else {
        clearTimeout(sendTimer);
        sendTimer = setTimeout(() => {
            if (rxCharacteristic) {
                lastAngleSent = angle;
                lastSendTime = Date.now();
                send("ANGLE:" + angle);
            }
        }, 70 - (now - lastSendTime));
    }
}

slider.addEventListener("input", () => {
    const angle = Number(slider.value);
    angleDisplay.textContent = angle + "°";
    sendSliderAngle(angle);
});

function returnToCenter() {
    if (slider.disabled) return;

    clearTimeout(sendTimer);
    slider.value = 90;
    angleDisplay.textContent = "90°";
    lastAngleSent = 90;
    lastSendTime = Date.now();
    send("CENTRER");
}

slider.addEventListener("pointerup", returnToCenter);
slider.addEventListener("pointercancel", returnToCenter);
slider.addEventListener("change", () => {
    if (!slider.matches(":active")) {
        returnToCenter();
    }
});

connectBtn.addEventListener("click", connect);

disconnectBtn.addEventListener("click", () => {
    if (device && device.gatt.connected) {
        device.gatt.disconnect();
    }
});

</script>
</body>
</html>
